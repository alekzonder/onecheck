# Include files contain only "rules".
rules:
  - name: site-up
    module: http
    tags: [web]
    timeout: 10s
    fail_after: 2
    params:
      url: https://example.com/
    check:
      status: { in: [200, 204] }
      headers.content-type: { starts_with: text/html }
      body: { contains: "Example Domain" }
      duration: { lt: 2s }
      tls_expires_in: { gt: 14d }

  - name: api-health
    module: http
    tags: [web, api]
    params:
      url: https://api.example.com/health
      headers:
        Authorization: "Bearer ${API_TOKEN}"   # taken from the environment
    check:
      status: 200
      body:
        json:
          assert:
            - { path: status, equals: ok }
            - { path: checks.#, gte: 1 }
            - { path: 'checks.#(state!="ok")#', length: 0 }
          schema:
            type: object
            required: [status, version]

  - name: nginx-active
    module: systemd
    tags: [web]
    params:
      unit: nginx.service
    check:
      active_state: active
      unit_file_state: enabled      # starts on boot
      restarts: { lt: 3 }           # not restarting in a loop

  - name: nginx-config-valid
    module: command
    tags: [web]
    params:
      argv: [nginx, -t]
    check:
      exit_code: 0

  - name: web-ports
    module: ports
    tags: [web]
    params:
      proto: tcp
    check:
      listening.#.port:
        all:
          - { contains: 80 }
          - { contains: 443 }

  - name: certbot-renew
    module: systemd
    tags: [web]
    params:
      unit: certbot.timer
    check:
      active_state: active
      idle_age: { lt: 25h }         # fired within the last day
      service_result: success       # and the renewal succeeded
