# Example onecheck config. Copy to /etc/onecheck/config.yaml and adjust.
# Check it with:  onecheck validate -c /etc/onecheck/config.yaml

# Required. Separates results, state and logs of different configs on one host:
#   <paths.results>/<name>/, <paths.state>/<name>/, <log.dir>/<name>/onecheck.log
name: main

log:
  level: info            # debug | info | warn | error; --log-level overrides
  dir: /var/log/onecheck
  format: text           # text | json
  rotate:                # used by "onecheck logrotate"
    max_size: 10MB
    keep: 5
    max_age: 30d
    compress: true

paths:
  modules: /usr/lib/onecheck/modules
  results: /var/lib/onecheck/results
  events: /var/lib/onecheck/events
  state: /var/lib/onecheck/state

# More rule files. Relative patterns are resolved against this file's directory.
include:
  - conf.d/*.yaml

events:
  ttl: 24h               # "onecheck logrotate" removes events older than this

run:
  parallel: 4            # checks running at the same time
  max_field_size: 10MB   # largest value (file content, response body) a module may return

defaults:                # for rules that do not set these themselves
  timeout: 30s
  fail_after: 1          # consecutive failures before the state becomes "fail"
  pass_after: 1          # consecutive passes before the state becomes "pass" again
  output_tail: 10k       # tail of stdout/stderr/response body kept in each result

modules:
  repos:                 # searched by "onecheck module search" without arguments
    - alekzonder/onecheck

rules:
  - name: passwd-sane
    module: file
    params:
      path: /etc/passwd
    check:
      exists: true
      type: file
      mode: "0644"
      owner: root
      size: { gt: 0, lt: 1MB }
      content: { contains: "root:" }

  - name: tmp-not-huge
    module: file
    tags: [disk]
    params:
      path: /tmp
    check:
      type: dir
      size: { lt: 5GB }
      count: { lt: 10000 }

  - name: disk-root
    module: disk
    tags: [disk]
    params:
      path: /
    check:
      used_percent: { lt: 90 }
      inodes_used_percent: { lt: 90 }

  - name: disk-data
    module: disk
    tags: [disk]
    fail_after: 2
    params:
      path: /var/lib       # any path inside the filesystem, or a device
    check:
      free: { gt: 5GB }

  - name: load-average
    module: cpu
    tags: [system]
    fail_after: 3        # three bad runs in a row before an event is written
    pass_after: 2
    check:
      load5_per_core: { lt: 1.5 }   # answers at once: no *_percent field is checked

  - name: cpu-busy
    module: cpu
    tags: [system]
    fail_after: 3
    params:
      window: 5s         # CPU usage is measured over this time
    check:
      usage_percent: { lt: 90 }

  - name: memory
    module: memory
    tags: [system]
    check:
      used_percent: { lt: 90 }
      swap_used_percent: { lt: 50 }

  - name: no-unknown-ports
    module: ports
    tags: [security]
    params:
      proto: tcp
    check:
      listening:          # every port reachable from outside must be allowed
        every:
          any:
            - { path: port, in: [22, 80, 443] }

  # Things no module reports are checked with "command".
  - name: clock-synced
    module: command
    tags: [system]
    params:
      argv: [timedatectl, show, --property=NTPSynchronized, --value]
    check:
      exit_code: 0
      stdout: "yes\n"
